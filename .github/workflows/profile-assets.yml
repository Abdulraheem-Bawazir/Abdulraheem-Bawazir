name: Generate Profile Assets

on:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * *"

permissions:
  contents: write

jobs:
  profile-assets:
    name: Generate profile cards and trophies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate GitHub profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: Abdulraheem-Bawazir
          BRANCH_NAME: main
          UTC_OFFSET: 4
          EXCLUDE: ""
          AUTO_PUSH: false
          THEME: tokyonight
          ANIMATION: load
          DURATION: 2.5
          NAME: Abdulraheem

      - name: Create profile asset directory
        run: mkdir -p profile

      - name: Generate GitHub trophies
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: Abdulraheem-Bawazir
          output_path: profile/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: dracula

      - name: Commit generated profile assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile-summary-card-output/tokyonight
          git add profile/trophy.svg

          if git diff --cached --quiet; then
            echo "No profile asset changes."
            exit 0
          fi

          git commit -m "chore: refresh profile assets [skip ci]"
          git push

  contribution-snake:
    name: Generate contribution snake
    runs-on: ubuntu-latest

    steps:
      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Abdulraheem-Bawazir
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#A78BFA
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#7C3AED

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
